{% extends 'base_content.html' %}

{% block content %}
<div class="card">
<div class="card-header align-items-center">
    <h5 class="card-action-title mb-5">Статистика</h5>
</div>
    <div class="card-body">
        <div class="row">
            <div class="col-lg-4 col-md-12 col-6 mb-6">
              <div class="card h-100">
                <div class="card-body">
                  <p class="mb-1">Пользователей</p>
                  <h4 class="card-title mb-3">{{ count_message }}</h4>
                </div>
              </div>
            </div>
            <div class="col-lg-4 col-md-12 col-6 mb-6">
              <div class="card h-100">
                <div class="card-body">
                  <p class="mb-1">Рассылок</p>
                  <h4 class="card-title mb-3">{{ count_mailing }}</h4>
                </div>
              </div>
            </div>
            <div class="col-lg-4 col-md-12 col-6 mb-6">
              <div class="card h-100">
                <div class="card-body">
                  <p class="mb-1">Сообщений</p>
                  <h4 class="card-title mb-3">{{ count_recipients }}</h4>
                </div>
              </div>
            </div>
          </div>
    </div>
</div>
{% endblock content %}
