<div class="modal-header">
    <h5 class="modal-title">Обновление сообщения</h5>
    <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"></button>
</div>
<div class="modal-body">
    <form method="post" enctype="multipart/form-data" action="{% url 'message:update_message' object.pk %}">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="justify-content-end d-flex">
            <a class="btn btn-primary text-white cursor-pointer mx-2" href="{% url 'message:message' %}">Отмена</a>
            <button class="btn btn-primary text-white cursor-pointer" type="submit">Обновить</button>
        </div>
    </form>
</div>
